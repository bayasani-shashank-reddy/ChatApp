spring.application.name=chat-app

# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── MongoDB ──────────────────────────────────────────────────────────────────
# ⚠️ IMPORTANT: To connect to MongoDB Atlas, you must use the full URI connection string.
# Provide your actual Atlas connection string or it will default to local development.
# Example: mongodb+srv://username:password@cluster0.ab1cd.mongodb.net/chatapp?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGO_URI:mongodb+srv://chatapp:$Shashank15.@cluster0.gwpvdac.mongodb.net/chatapp?retryWrites=true&w=majority&appName=Cluster0}

# Auto-index creation
spring.data.mongodb.auto-index-creation=true

# ── Thymeleaf ────────────────────────────────────────────────────────────────
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:ChatApp-Secret-Key-Min32Chars-ChangeInProd!}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CORS ─────────────────────────────────────────────────────────────────────
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}

# ── File upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Static resources ──────────────────────────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/
# spring.mvc.static-path-pattern=/**

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.chatapp=INFO
logging.level.org.springframework.security=WARN
