services:
  - type: web
    name: chat-app-backend
    runtime: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/java-server-0.0.1-SNAPSHOT.jar
    envVars:
      - key: MONGO_URI
        sync: false   # Set this secret in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set this secret in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false   # Set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: JWT_EXPIRATION
        value: 86400000
