<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Status - Chat Super App</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>Call Status</h1>
        </header>
        <main>
            <div id="statusContainer" class="status">
                <p>Loading status...</p>
            </div>
        </main>
    </div>
    <script src="/config.js"></script>
    <script>
        // Minimal vanilla JS to fetch status (replace CALL_ID with actual ID)
        const callId = new URLSearchParams(window.location.search).get('callId') || 'sample-id';
        const apiBase = (typeof BACKEND_URL !== 'undefined' && BACKEND_URL && !BACKEND_URL.includes('YOUR-RENDER')) ? BACKEND_URL : '';
        fetch(`${apiBase}/api/status/${callId}`)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('statusContainer');
                container.innerHTML = `<p>Call ID: ${data.callId}</p><p>Status: ${data.status}</p>`;
            })
            .catch(err => {
                document.getElementById('statusContainer').innerHTML = '<p>Error loading status.</p>';
            });
    </script>
</body>

</html>
